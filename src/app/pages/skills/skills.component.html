<section class="skills-page">
    <h1 class="page-title">Mes Compétences</h1>

    <div class="tabs">
        <button [class.active]="activeTab === 'Technique'" (click)="setTab('Technique')">Techniques</button>
        <button [class.active]="activeTab === 'Humaine'" (click)="setTab('Humaine')">Humaines</button>
    </div>

    <div class="skills-container">
        <div class="chart-section">
            @if (isBrowser) {
            <canvas baseChart [data]="radarChartData" [options]="radarChartOptions" [type]="radarChartType">
            </canvas>
            }
        </div>

        <div class="skills-list">
            <div class="skill-card" *ngFor="let skill of (activeTab === 'Technique' ? technicalSkills : softSkills)"
                [routerLink]="['/competences', skill.id]">
                <div class="skill-info">
                    <h3>{{ skill.name }}</h3>
                    <div class="progress-bar">
                        <div class="progress" [style.width.%]="skill.level"></div>
                    </div>
                </div>
                <span class="view-detail">Détails →</span>
            </div>
        </div>
    </div>
</section>
